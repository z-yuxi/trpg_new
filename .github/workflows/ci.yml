name: RC 发布门禁（全量 CI）

on:
  push:
    branches: [main, dev-*, release-*]
  pull_request:
    branches: [main]

# 同分支只保留最新一次运行，节省 runner 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── Job 1: 静态检查（最快，先跑） ─────────────────────────────────────────────
jobs:
  static-checks:
    name: 静态检查（术语守卫 + 迁移验证）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 术语守卫
        run: pnpm lint:terms

      - name: 迁移正反向验证
        run: pnpm verify:migrations

# ─── Job 2: 发布门禁验收套件 ───────────────────────────────────────────────────
  acceptance-gate:
    name: 验收套件（auth + 招募筛选 + 消息可见性）
    runs-on: ubuntu-latest
    needs: static-checks
    env:
      JWT_SECRET: ci_test_jwt_secret_not_for_production
      DB_HOST: 127.0.0.1
      DB_USER: trpg
      DB_PASSWORD: trpg_password
      DB_NAME: trpg_platform
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 验收套件（发布门禁）
        run: pnpm test:accept

# ─── Job 3: API 合同测试 ────────────────────────────────────────────────────────
  contract-tests:
    name: API 合同测试（响应形状锁定）
    runs-on: ubuntu-latest
    needs: static-checks
    env:
      JWT_SECRET: ci_test_jwt_secret_not_for_production
      DB_HOST: 127.0.0.1
      DB_USER: trpg
      DB_PASSWORD: trpg_password
      DB_NAME: trpg_platform
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: API 合同测试
        run: pnpm --filter @trpg/server exec vitest run src/__tests__/contract/api-contract.test.ts

# ─── Job 4: 全量单元测试 ─────────────────────────────────────────────────────
  unit-tests:
    name: 全量单元测试（server + client + shared）
    runs-on: ubuntu-latest
    needs: static-checks
    env:
      JWT_SECRET: ci_test_jwt_secret_not_for_production
      DB_HOST: 127.0.0.1
      DB_USER: trpg
      DB_PASSWORD: trpg_password
      DB_NAME: trpg_platform
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 全量单元测试
        run: pnpm test

# ─── Job 5: 发布门禁脚本（deploy-check.sh CI 版） ───────────────────────────
  deploy-script-gate:
    name: 发布门禁脚本（tsc + 安全测试 + 客户端构建）
    runs-on: ubuntu-latest
    needs: static-checks
    env:
      JWT_SECRET: ci_test_jwt_secret_not_for_production
      DB_HOST: 127.0.0.1
      DB_USER: trpg
      DB_PASSWORD: trpg_password
      DB_NAME: trpg_platform
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 发布门禁脚本（跳过 E2E 和迁移，避免重复）
        run: bash scripts/deploy-check.sh --skip-e2e --skip-migrate

# ─── Job 6: Docker 构建冒烟（仅 main / release-* 分支运行） ──────────────────
  docker-smoke:
    name: Docker 构建冒烟（server + client 镜像）
    runs-on: ubuntu-latest
    needs: [acceptance-gate, contract-tests, unit-tests]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-')
    steps:
      - uses: actions/checkout@v4

      - name: 构建 server 镜像
        run: docker build --target server -t trpg-server:smoke .

      - name: 构建 client 镜像
        run: docker build --target client -t trpg-client:smoke .

      - name: 冒烟：server 镜像健康检查（--help 冒烟，不依赖真实 DB）
        run: |
          docker run --rm \
            -e JWT_SECRET=smoke_test_secret \
            -e DB_HOST=127.0.0.1 \
            -e DB_USER=trpg \
            -e DB_PASSWORD=trpg_password \
            -e DB_NAME=trpg_platform \
            -e REDIS_HOST=127.0.0.1 \
            -e REDIS_PORT=6379 \
            -e REDIS_PASSWORD=smoke \
            -e NODE_ENV=production \
            --entrypoint node \
            trpg-server:smoke \
            packages/server/dist/server.js --version 2>&1 || true
          echo "Docker smoke: server image built successfully"

# ─── Job 7: 发布就绪汇总（所有关键 job 通过才绿灯） ─────────────────────────
  release-ready:
    name: ✅ 发布就绪汇总
    runs-on: ubuntu-latest
    needs: [acceptance-gate, contract-tests, unit-tests, deploy-script-gate]
    if: always()
    steps:
      - name: 检查所有关键 job 状态（P0 阻断判定）
        run: |
          echo "acceptance-gate:    ${{ needs.acceptance-gate.result }}"
          echo "contract-tests:     ${{ needs.contract-tests.result }}"
          echo "unit-tests:         ${{ needs.unit-tests.result }}"
          echo "deploy-script-gate: ${{ needs.deploy-script-gate.result }}"

          # P0 阻断：任意关键 job 失败立即拒绝发布
          FAILED=false
          FAILED_JOBS=""
          if [[ "${{ needs.acceptance-gate.result }}" != "success" ]]; then
            FAILED=true; FAILED_JOBS="$FAILED_JOBS acceptance-gate"
          fi
          if [[ "${{ needs.contract-tests.result }}" != "success" ]]; then
            FAILED=true; FAILED_JOBS="$FAILED_JOBS contract-tests"
          fi
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            FAILED=true; FAILED_JOBS="$FAILED_JOBS unit-tests"
          fi
          if [[ "${{ needs.deploy-script-gate.result }}" != "success" ]]; then
            FAILED=true; FAILED_JOBS="$FAILED_JOBS deploy-script-gate"
          fi

          if [[ "$FAILED" == "true" ]]; then
            echo "::error::[P0] CI 门禁未通过，失败 job：$FAILED_JOBS，禁止合并/发布"
            exit 1
          fi
          echo "✅ 所有关键检查通过，可以发布"

      # P0 告警：CI 门禁失败时向 webhook 推送（企业微信机器人 / 飞书 / 钉钉）
      - name: P0 告警 — 推送 CI 失败通知
        if: failure() && env.ALERT_P0_WEBHOOK_URL != ''
        run: |
          FAILED_JOBS="acceptance-gate(${{ needs.acceptance-gate.result }}) contract-tests(${{ needs.contract-tests.result }}) unit-tests(${{ needs.unit-tests.result }}) deploy-script-gate(${{ needs.deploy-script-gate.result }})"
          curl -sS -X POST "$ALERT_P0_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"level\":\"P0\",\"key\":\"ci_gate_failed\",\"message\":\"[P0] CI 门禁失败，禁止发布 | branch=${{ github.ref_name }} commit=${{ github.sha }} jobs=${FAILED_JOBS}\",\"service\":\"trpg-ci\"}" \
            || echo "::warning::P0 webhook 推送失败，请检查 ALERT_P0_WEBHOOK_URL secret"
        env:
          ALERT_P0_WEBHOOK_URL: ${{ secrets.ALERT_P0_WEBHOOK_URL }}
