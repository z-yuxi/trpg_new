name: 术语守卫 & 单元测试

on:
  push:
    branches: [main, dev-*, release-*]
  pull_request:
    branches: [main]

jobs:
  terminology-guard:
    name: 术语词典合规检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行术语守卫
        run: pnpm lint:terms

  unit-tests:
    name: 单元测试（server + client + shared）
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci_test_jwt_secret_not_for_production
      DB_HOST: 127.0.0.1
      DB_USER: trpg
      DB_PASSWORD: trpg_password
      DB_NAME: trpg_platform
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行全量单元测试
        run: pnpm test
