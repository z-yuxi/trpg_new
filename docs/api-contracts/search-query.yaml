openapi: 3.0.3
info:
  title: TRPG 平台 API - 搜索结果与推荐标签
  version: 1.0.0
  description: |
    统一搜索接口（实体维度）并返回结果态推荐标签 suggested_tags。
    注意：suggested_tags 为搜索结果增强，不属于输入态自动补全，不调用 AI 服务。

paths:
  /api/v1/search/{entity}:
    get:
      summary: 搜索并返回推荐标签
      operationId: searchByEntity
      tags:
        - 搜索
      parameters:
        - name: entity
          in: path
          required: true
          schema:
            type: string
            enum: [modules, rulesets, recruitment_posts]
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
      responses:
        '200':
          description: 搜索成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 触发搜索限流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务异常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    SuggestedTag:
      type: object
      required: [tag, type, weight]
      properties:
        tag:
          type: string
          maxLength: 64
        type:
          type: string
          enum: [era, style, duration, difficulty, system, other]
        weight:
          type: number
          minimum: 0
          maximum: 1
          format: float

    SearchResultItem:
      type: object
      additionalProperties: true
      description: 各实体的搜索结果项，字段由实体自身契约定义。

    SearchResponse:
      type: object
      required: [results, suggested_tags]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultItem'
        suggested_tags:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/SuggestedTag'

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
