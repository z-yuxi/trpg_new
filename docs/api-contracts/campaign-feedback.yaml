openapi: 3.0.3
info:
  title: TRPG 平台 API — 跑团反馈（Stars and Wishes）
  version: 2.0.0
  description: |
    跑团结束后的正向反馈接口。反馈不是星级互评，不参与信誉分计算。

    **业务约束**：
    - 反馈窗口期：房间 `ended_at + 14 天`，超期不可提交
    - 反馈提交方需为该 campaign 的 GM 或玩家成员
    - `feedback_type` 仅允许 `star` / `wish`
    - `visibility` 默认 `gm_only`，仅 GM 可切换为 `party`

servers:
  - url: /api

tags:
  - name: 跑团反馈
    description: 跑团结束后的 Stars and Wishes 反馈

paths:
  /campaigns/{campaignId}/reviews:
    post:
      summary: 提交跑团反馈
      operationId: createCampaignFeedback
      tags: [跑团反馈]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: campaignId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignFeedbackRequest'
      responses:
        '201':
          description: 反馈提交成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignFeedback' }
        '400':
          description: 参数错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalid_feedback_type:
                  value: { error: INVALID_FEEDBACK_TYPE }
                empty_content:
                  value: { error: EMPTY_FEEDBACK_CONTENT }
        '401':
          description: 未登录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: 用户不是该 campaign 成员或无权访问
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_member:
                  value: { error: USER_NOT_CAMPAIGN_MEMBER }
        '404':
          description: Campaign 不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_found:
                  value: { error: CAMPAIGN_NOT_FOUND }
        '409':
          description: 业务冲突（房间未结束、评价窗口已过期、重复评价）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_ended:
                  value: { error: CAMPAIGN_NOT_ENDED }
                window_expired:
                  value: { error: FEEDBACK_WINDOW_EXPIRED }

    get:
      summary: 获取房间反馈列表
      operationId: listCampaignFeedback
      tags: [跑团反馈]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: campaignId, in: path, required: true, schema: { type: string } }
        - { name: visibility, in: query, schema: { type: string, enum: [gm_only, party] } }
      responses:
        '200':
          description: 反馈列表
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CampaignFeedback' }

  /campaigns/{campaignId}/reviews/{feedbackId}:
    patch:
      summary: 修改跑团反馈
      operationId: updateCampaignFeedback
      tags: [跑团反馈]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: campaignId, in: path, required: true, schema: { type: string } }
        - { name: feedbackId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCampaignFeedbackRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignFeedback' }
        '403':
          description: 非反馈创建者不能编辑
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    delete:
      summary: 删除跑团反馈
      operationId: deleteCampaignFeedback
      tags: [跑团反馈]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: campaignId, in: path, required: true, schema: { type: string } }
        - { name: feedbackId, in: path, required: true, schema: { type: string } }
      responses:
        '204':
          description: 删除成功
        '403':
          description: 非反馈创建者不能删除
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CampaignFeedback:
      type: object
      required: [id, campaign_id, reviewer_id, review_type, feedback_type, visibility, content, is_edited, created_at]
      properties:
        id:            { type: string }
        campaign_id:   { type: string }
        reviewer_id:   { type: string }
        review_type:   { type: string, enum: [campaign] }
        feedback_type: { type: string, enum: [star, wish] }
        visibility:    { type: string, enum: [gm_only, party] }
        content:       { type: string, maxLength: 500 }
        is_edited:     { type: boolean }
        edited_at:     { type: string, format: date-time, nullable: true }
        created_at:    { type: string, format: date-time }

    CreateCampaignFeedbackRequest:
      type: object
      required: [feedback_type, content]
      properties:
        feedback_type: { type: string, enum: [star, wish] }
        content:       { type: string, maxLength: 500 }
        visibility:    { type: string, enum: [gm_only, party], default: gm_only }

    UpdateCampaignFeedbackRequest:
      type: object
      properties:
        content:       { type: string, maxLength: 500 }
        visibility:    { type: string, enum: [gm_only, party] }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }