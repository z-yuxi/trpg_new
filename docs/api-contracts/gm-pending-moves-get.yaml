openapi: 3.0.3
info:
  title: TRPG 平台 API - 跑团房间（GM 导演台）
  version: 1.1.0
  description: 获取导演台待审批移动列表。

paths:
  /api/v1/campaigns/{campaign_id}/gm/pending-moves:
    get:
      summary: 获取待审批移动申请列表
      description: 返回 status=pending 的移动申请。
      operationId: getPendingMoves
      tags:
        - 跑团房间
      security:
        - bearerAuth: []
      parameters:
        - name: campaign_id
          in: path
          required: true
          description: 房间 ID
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: 成功返回列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPendingMovesResponse'
              example:
                total: 2
                moves:
                  - move_id: move_001
                    character_id: char_001
                    character_name: 张三
                    from_scene_id: scene_001
                    from_scene_name: 酒馆
                    to_scene_id: scene_002
                    to_scene_name: 教堂
                    travel_method: walk
                    estimated_duration_minutes: 15
                    created_at: '2026-04-29T10:00:00Z'
                  - move_id: move_002
                    character_id: char_002
                    character_name: 李四
                    from_scene_id: null
                    from_scene_name: null
                    to_scene_id: scene_003
                    to_scene_name: 森林
                    travel_method: null
                    estimated_duration_minutes: null
                    created_at: '2026-04-29T10:05:00Z'
        '401':
          description: 未授权
        '403':
          description: 非 GM 无权访问
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PendingMove:
      type: object
      required:
        - move_id
        - character_id
        - character_name
        - to_scene_id
        - to_scene_name
        - created_at
      properties:
        move_id:
          type: string
        character_id:
          type: string
        character_name:
          type: string
        from_scene_id:
          type: string
          nullable: true
        from_scene_name:
          type: string
          nullable: true
        to_scene_id:
          type: string
        to_scene_name:
          type: string
        travel_method:
          type: string
          enum: [walk, bike, drive]
          nullable: true
        estimated_duration_minutes:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
    GetPendingMovesResponse:
      type: object
      required: [total, moves]
      properties:
        total:
          type: integer
        moves:
          type: array
          items:
            $ref: '#/components/schemas/PendingMove'
    ErrorResponse:
      type: object
      required: [error_code, message]
      properties:
        error_code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        retry_after:
          type: integer
