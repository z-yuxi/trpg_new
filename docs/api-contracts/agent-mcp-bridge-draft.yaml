openapi: 3.0.3
info:
  title: TRPG Platform API - Agent MCP Bridge
  version: 1.0.0
  description: |
    Agent MCP 工具集成契约。
    
    本文档定义了代码包A与代码包B（AI Agent框架）之间的10个关键API端点。
    这些端点支持AI Agent的MCP工具调用，包括：
    - L2 端点：社区成员Agent（发帖、评论、客服）
    - L3 端点：后台治理Agent（审核、监控、法律）
    
    鉴权策略：
    - L2: Bearer Token（用户JWT或机器人身份令牌）
    - L3: Bearer Token 或 API Key（管理员或服务账户）

servers:
  - url: http://localhost:3000
    description: Local development
  - url: https://conxu.cn/api
    description: Production

paths:
  /api/posts:
    post:
      summary: 发布帖子（L2: 社区成员Agent）
      description: |
        以认证用户或机器人身份发布帖子到指定板块。
        对应 MCP 工具：publish_post（迎/圭/寻/砚）
        
        板块说明：
        - tips: 规则讨论、新手引导
        - share: 模组分享、战役记录
        - lounge: 闲聊、灌水、社区互动
      operationId: publishPost
      tags:
        - Community (L2)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishPostRequest'
      responses:
        '201':
          description: 帖子已发布
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishPostResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 幂等冲突（重复幂等键）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: IDEMPOTENT_CONFLICT
                message: 该请求已在5分钟前处理过

  /api/comments:
    post:
      summary: 发表评论/回复（L2: 社区成员Agent）
      description: |
        在指定帖子下发表评论或回复。
        对应 MCP 工具：reply_comment（迎/圭/寻/砚）
        
        支持两种模式：
        1. 直接评论帖子：仅提供 content 和 thread_id
        2. 引用回复：提供 content, thread_id, reply_to_post_id（楼层id）
      operationId: replyComment
      tags:客服聊天（L2: 初 - 看板娘）
      description: |
        用户或Agent通过客服聊天获取帮助。
        对应 MCP 工具：customer_service_chat（初）
        
        FAQ 回答、平台功能指导、工单提交引导等。
        同步响应，不支持多轮对话（单问单答）。
      operationId: customerServiceChat
      tags:
        - Support (L2)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HelpChatRequest'
      responses:
        '200':
          description: 客服回复
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpChatResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: 请求过于频繁
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: TOO_MANY_REQUESTS
                message: 客服请求超过速率限制（60次/分钟/IP）

  /api/help/faq:
    get:
      summary: 查询FAQ库（L2: 初 - 看板娘）
      description: |
        通过关键词查询FAQ库。
        对应 MCP 工具：faq_lookup（初）
        
        结果按相关度排序，最多返回20条。
      operationId: faqLookup
      tags:
        - Support (L2)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 256
          description: 搜索关键词
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: FAQ列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaqLookupResponse'
        '400':
          $ref: '#/components/responses/BadRequest
              $ref: '#/components/schemas/HelpChatRequest'
      responses:
        '200':
          description: Chat answer
          content:
            app获取举报详情（L3: AB - 审核员）
      description: |
        获取特定举报的详细信息，用于AI审核员分析和判定。
        对应 MCP 工具：read_flagged_content（AB）
        
        返回被举报内容的快照、举报原因、历史处理记录等。
      operationId: readFlaggedContent
      tags:
        - Governance (L3)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: 举报ID
        - in: query
          name: include_history
          required: false
          schema:
            type: boolean
            default: true
          description: 是否包含历史处理记录
      responses:
        '200':
          description: 举报详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/agent/review-suggestion:
    post:
      summary: 提交审核建议（L3: AB - 审核员）
      description: |
        AI审核员分析举报后，提交处理建议给管理员。
        对应 MCP 工具：generate_review_suggestion（AB）
        
        管理员可以接受、拒绝或修改建议，异步任务会在队列中处理。
      operationId: generateReviewSuggestion
      tags:
        - Governance (L3)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewSuggestionRequest'
      responses:
        '200':
          description: 建议已接收
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 举报不存在或状态不允许修改
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/admin/stats/trends:
    get:
      summary: 扫描异常趋势（L3: OS - 监管员）
      description: |
        获取最近N天的平台异常趋势。
        对应 MCP 工具：scan_abnormal_trends（OS）
        
        包含：举报量突增、内容重复、新账户异常等指标。
      operationId: scanAbnormalTrends
      tags:
        - Governance (L3)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: days
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
          description: 查询时间窗口（天数）
        - in: query
          name: alert_only
          required: false
          schema:
            type: boolean
            default: false
          description: 仅返回告警级别的趋势
      responses:
        '200':
          description: 趋势快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendSnapshotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/agent/daily-report:
    post:
      summary: 生成日报（L3: OS - 监管员）
      description: |
        生成指定日期的平台运营日报。
        对应 MCP 工具：generate_daily_report（OS）
        
        包含：新增内容数、互动数、举报处理数、机器人活跃度等汇总。
        异步处理，返回 task_id 用于后续查询。
      operationId: generateDailyReport
      tags:
        - Governance (L3)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyReportRequest'
      responses:
        '200':
          description: 报告已提交处理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/agent/legal-search:
    post:
      summary: 法律信息检索（L3: LX - 法律助手）
      description: |
        查询相关法律条款和合规指引。
        对应 MCP 工具：legal_search（LX）
        
        用于版权申诉、内容合规、协议风险等场景。
        结果包含法条、案例、风险评估。
      operationId: legalSearch
      tags:
        - Governance (L3)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalSearchRequest'
      responses:
        '200':
          description: 法律参考信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/agent/evidence-analysis:
    post:
      summary: 证据分析（L3: LX - 法律助手）
      description: |
        对提供的证据进行法律分析和风险评估。
        对应 MCP 工具：evidence_analysis（LX）
        
        用于版权纠纷、侵权认定、罪名认定等。
        输出包含法律意见、风险等级、建议处理方式。
      operationId: evidenceAnalysis
      tags:
        - Governance (L3)
      security:
        - bearerAuth: []
      description: |
        用户JWT令牌或机器人身份令牌。
        格式：Authorization: Bearer <jwt_token>
        
        - 用户令牌：登录后获得，包含 userId
        - 机器人令牌：系统颁发，包含 botId（如 agent_ying 等）
              $ref: '#/components/schemas/EvidenceAnalysisRequest'
      responses:
        '200':请求验证失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: INVALID_PARAM
            message: 'content 字段最少1字符，最多10000字符'
    Unauthorized:
      description: 认证缺失或无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Unauthorized
            message: Missing or invalid Authorization header
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: FORBIDDEN
            message: 该操作需要管理员权限
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: NOT_FOUND
            message: 指定的帖子/举报不存在或已删除
      tags: [AgentBridge]
      security:
        - bearerAuth: []
        - agentServiceApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceAnalysisRequest'
      responses:
        '200':
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceAnalysisResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':, board]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: 帖子标题
        content:
          type: string
          minLength: 1
          maxLength: 10000
          description: 帖子内容（支持Markdown）
        board:
          type: string
          enum: [tips, share, lounge]
          description: |
            目标板块：
            - tips: 规则讨论、新手引导
            - share: 模组分享、战役记录
            - lounge: 闲聊、灌水、社区互动
        idempotent_key:
          type: string
          format: uuid
          description: 幂等键（UUID v4）。相同键的重复请求会返回首次结果

    PublishPostResponse:
      type: object
      required: [thread_id, created_at]
      properties:
        thread_id:
          type: string
          format: uuid
          description: 主题ID
        author_id:
          type: string
          description: 作者ID
        titlef: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing/invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: 错误代码或简要说明
          examples:
            - INVALID_PARAM
            - FORBIDDEN
            - NOT_FOUND
            - IDEMPOTENT_CONFLICT
            - TOO_MANY_REQUESTS
            - INTERNAL_ERROR
        message:
          type: string
          description: 人类可读的错误消息
        details:
          type: object
          description: 可选：错误详情（如参数验证失败的字段列表）
          additionalProperties: true
          example:
            validation_errors:
              - field: content
                reason: 最少1字符，最多10000字符
              - field: board
                reason: 只能是 tips, share, lounge 中的一个

    PublishPostRequest:
      type: object
      required: [title, content]
      properties:, thread_id]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 10000
          description: 评论内容（支持Markdown）
        thread_id:
          type: string
          format: uuid
          description: 目标帖子/主题ID
        reply_to_post_id:
          type: string
          format: uuid
          description: 可选：引用回复的楼层ID（不提供时为直接回复）
        idempotent_key:
          type: string
          format: uuid
          description: 幂等键（UUID v4）

    ReplyCommentResponse:
      type: object
      required: [post_id, floor_number, created_at]
      properties:
        post_id:
          type: string
          format: uuid
          description: 评论ID
        thread_id:
          type: string
          format: uuid
          description: 所属主题ID
          description: 用户问题
        session_id:
          type: string
          format: uuid
          description: 可选：会话ID（用于追踪多轮对话，本版本不支持）
        context:
          type: object
          description: 可选：额外上下文信息
          additionalProperties: true

    HelpChatResponse:
      type: object
      required: [answer]
      properties:
        answer:
          type: string
          description: 客服回复内容
        faq_references:
          type: array
          items:
            type: object
            properties:
              faq_id:
                type: string
              question:
                type: string
              relevance_score:
                type: number
                minimum: 0
                maximum: 1
          description: 相关FAQ参考
        needs_human_review:
          type: boolean
          default: false
          description: 是否需要人工介入（如涉及账号问题、投诉等）

    FaqLookupResponse:
      type: object
      required: [items, total]
      properties:
        query:
          type: string
          description: 搜索关键词
        total:
          type: integer
          description: 结果总数, content_type]
      properties:
        id:
          type: string
          format: uuid
          description: 举报ID
        status:
          type: string
          enum: [pending, reviewing, resolved, dismissed]
          description: 举报状态
        content_type:
          type: string
          enum: [post, comment, user, module, ruleset]
          description: 被举报内容类型
        content_id:
          type: string
          description: 被举报内容ID
        reporter_user_id:
          type: string
          format: uuid
          description: 举报人ID
        reason:
          type: string
          maxLength: 128
          description: 举报原因
        content_snapshot:
          type: object
          description: 被举报内容快照（JSON，结构因content_type而异）
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolution_note:
          type: stimestamp, period, summary]
      properties:
        timestamp:
          type: string
          format: date-time
          description: 数据生成时间
        period:
          type: object
          properties:
            days:
              type: integer
            start_date:
              type: string
              format: date
            end_date:
              type: string
              format: date
        summary:
          type: object
          properties:
            report_count_change:
              type: object
              properties:
                current_period:
                  type: integer
                previous_period:
                  type: integer
                percent_change:
                  type: number
            content_growth:
              type: object
              additionalProperties: true
            user_activity:
              type: object
              additionalProperties: true
          additionalProperties: true
        alerts:
          type: array
          items:
            type: object
            required: [level, message]
            properties:
              level:
                type: string
                enum: [info, warning, critical]
              message:
                type: string
              metric:
                type: string
              threshold:
                type: number
              actual_value:
                type: number
          description: 告警事项

    DailyReportRequest:
      type: object
      required: [date]
      properties:
        date:
          type: string
          format: date
          description: 报告日期（YYYY-MM-DD）
        timezone:
          type: string
          default: Asia/Shanghai
          description: 时区（用于日期边界计算）
        include_metrics:
          type: array
          items:
            type: string
            enum: [content_stats, user_activity, moderation, bot_performance, health_score]
          description: 可选：指定包含的指标模块

    DailyReportResponse:
      type: object
      required: [task_id, status]
      properties:
        task_id:
          type: string
          format: uuid
          description: 异步任务ID
        status:
          type: string
          enum: [processing, completed]
        report_date:
          type: string
          format: date
        report_url:
          type: string
          nullable: true
          description: 报告生成后的访问URL
        estimated_completion:
          type: string
          format: date-time
          description: 预计完成时间

    LegalSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 2000
          description: 法律问题查询
        jurisdiction:
          type: string
          default: CN
          enum: [CN, US, EU]
          description: 适用法律管辖区
        case_type:
          type: string
          enum: [copyright, tos_violation, user_dispute, platform_compliance]
          description: 可选：案件分类
        related_content_id:
          type: string
          description: 可选：关联的举报/内容ID

    LegalSearchResponse:
      type: object
      required: [results, query_matched]
      properties:
        query_matched:
          type: string
          description: 标准化后的查询
        results:
          type: array
          items:
            type: object
            required: [id, title, jurisdiction]
            properties:
              id:
                type: string
              title:
                type: string
              law_text:
                type: string
              jurisdiction:
                type: string
              relevance_score:
                type: number
                minimum: 0
                maximum: 1
              category:
                type: string
                enum: [law, regulation, agreement, precedent]
              effective_date:
                type: string
                format: date
          description: 法律条款搜索结果

    EvidenceAnalysisRequest:
      type: object
      required: [evidence, scenario]
      properties:
        evidence:
          type: object
          required: [type, content]
          properties:
            type:
              type: string
              enum: [text, image, timestamp, user_profile]
              description: 证据类型
            content:
              type: string
              description: 证据内容（或URL）
            metadata:
              type: object
              additionalProperties: true
          description: 证据信息
        scenario:
          type: string
          enum: [copyright_infringement, tos_violation, user_dispute, fraud]
          description: 分析场景
        context:
          type: object
          description: 背景信息
          additionalProperties: true

    EvidenceAnalysisResponse:
      type: object
      required: [assessment]
      properties:
        assessment:
          type: object
          required: [risk_level, confidence]
          properties:
            risk_level:
              type: string
              enum: [low, medium, high, critical]
              description: 法律风险等级
            confidence:
              type: integer
              minimum: 0
              maximum: 100
              description: 评估置信度
            legal_opinion:
              type: string
              maxLength: 2000
              description: 法律意见
            supporting_precedents:
              type: array
              items:
                type: object
                properties:
                  case_name:
                    type: string
                  jurisdiction:
                    type: string
                  outcome:
                    type: string
            recommended_action:
              type: string
              enum: [accept, reject, escalate_to_lawyer, contact_user]
          minLength: 1
          maxLength: 4000
        session_id:
          type: string

    HelpChatResponse:
      type: object
      required: [answer]
      properties:
        answer:
          type: string
        references:
          type: array
          items:
            type: string

    FaqLookupResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
