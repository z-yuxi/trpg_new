openapi: 3.0.3
info:
  title: TRPG 平台 API — 互评与信誉分（v1.0）
  version: 1.0.0
  description: |
    跑团结束后 GM↔玩家双向评价，以及基于滚动均值的信誉分查询。

    **业务约束**：
    - 评价窗口期：房间 `ended_at + 14 天`，超期不可提交
    - 每对 reviewer/reviewee 在同一 campaign 仅能提交一次
    - 评价提交方需为该 campaign 的 GM 或玩家成员
    - `reviewer_role` 必须与提交方在该 campaign 的实际角色一致

servers:
  - url: /api

tags:
  - name: 评价
    description: 跑团结束后的互评操作
  - name: 信誉
    description: 用户信誉分查询

paths:
  /campaigns/{campaignId}/reviews:
    post:
      summary: 提交评价
      operationId: createReview
      tags: [评价]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: campaignId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: 评价提交成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400':
          description: 参数错误（无效星级、自评）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                invalid_rating:
                  value: { error: INVALID_RATING }
                self_review:
                  value: { error: SELF_REVIEW_NOT_ALLOWED }
                role_mismatch:
                  value: { error: ROLE_MISMATCH }
        '401':
          description: 未登录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: 用户不是该 campaign 成员
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_member:
                  value: { error: USER_NOT_CAMPAIGN_MEMBER }
        '404':
          description: Campaign 不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_found:
                  value: { error: CAMPAIGN_NOT_FOUND }
        '409':
          description: 业务冲突（房间未结束、评价窗口已过期、重复评价）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                not_ended:
                  value: { error: CAMPAIGN_NOT_ENDED }
                window_expired:
                  value: { error: REVIEW_WINDOW_EXPIRED }
                already_reviewed:
                  value: { error: REVIEW_ALREADY_EXISTS }

    get:
      summary: 获取房间评价列表
      operationId: listCampaignReviews
      tags: [评价]
      parameters:
        - { name: campaignId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 评价列表
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Review' }

  /campaigns/{campaignId}/reviews/my-status:
    get:
      summary: 查询当前用户在此 campaign 的评价提交状态
      operationId: getMyReviewStatus
      tags: [评价]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: campaignId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 已提交评价的被评价人 ID 列表
          content:
            application/json:
              schema:
                type: object
                required: [submitted_for]
                properties:
                  submitted_for:
                    type: array
                    items: { type: string }

  /users/{userId}/reputation:
    get:
      summary: 获取用户信誉汇总
      operationId: getUserReputation
      tags: [信誉]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 信誉汇总
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReputationScore' }

  /users/{userId}/reviews:
    get:
      summary: 获取用户收到的评价列表
      operationId: listUserReviews
      tags: [信誉]
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
        - { name: limit,  in: query, schema: { type: integer, default: 20, maximum: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: 评价列表（按时间倒序）
          content:
            application/json:
              schema:
                type: object
                required: [data, limit, offset]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Review' }
                  limit:  { type: integer }
                  offset: { type: integer }

# ── 公共组件 ───────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Review:
      type: object
      required: [id, campaign_id, reviewer_id, reviewee_id, reviewer_role, rating, created_at]
      properties:
        id:             { type: string }
        campaign_id:    { type: string }
        reviewer_id:    { type: string }
        reviewee_id:    { type: string }
        reviewer_role:  { type: string, enum: [gm, player] }
        rating:         { type: integer, minimum: 1, maximum: 5 }
        comment:        { type: string, maxLength: 500, nullable: true }
        created_at:     { type: string, format: date-time }

    ReputationScore:
      type: object
      required: [user_id, avg_rating, total_reviews, gm_reviews, player_reviews, updated_at]
      properties:
        user_id:        { type: string }
        avg_rating:     { type: number, format: float, minimum: 0, maximum: 5 }
        total_reviews:  { type: integer, minimum: 0 }
        gm_reviews:     { type: integer, minimum: 0 }
        player_reviews: { type: integer, minimum: 0 }
        updated_at:     { type: string, format: date-time }

    CreateReviewRequest:
      type: object
      required: [reviewee_id, reviewer_role, rating]
      properties:
        reviewee_id:    { type: string, minLength: 1 }
        reviewer_role:  { type: string, enum: [gm, player] }
        rating:         { type: integer, minimum: 1, maximum: 5 }
        comment:        { type: string, maxLength: 500, nullable: true }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
