openapi: 3.0.3
info:
  title: TRPG 平台 API - AI 配额
  version: 1.0.0
  description: 查询当前用户当月 AI 使用统计（仅统计 success）。

paths:
  /api/ai/quota:
    get:
      summary: 获取 AI 月度配额使用量
      operationId: getAiQuota
      tags:
        - AI
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiQuotaResponse'
        '401':
          description: 未授权

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AiQuotaUsed:
      type: object
      properties:
        import_module:
          type: integer
        check_text:
          type: integer
        log_summary:
          type: integer
        generate_recipe:
          type: integer
      additionalProperties: false
    AiQuotaResponse:
      type: object
      required:
        - month
        - used
      properties:
        month:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}$'
          description: 统计月份（YYYY-MM）。
        used:
          $ref: '#/components/schemas/AiQuotaUsed'
