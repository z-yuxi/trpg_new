<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVG 预览稿（历史参考）</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #5B8DB8;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 20px;
      background: radial-gradient(circle at top right, #e8f1f8 0%, var(--bg) 45%);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .wrap {
      max-width: 860px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 28px rgba(31, 41, 55, 0.06);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1.35;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      border: 1px solid color-mix(in srgb, var(--accent) 42%, white);
      background: color-mix(in srgb, var(--accent) 12%, white);
      color: var(--accent);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      margin-bottom: 14px;
    }
    p {
      margin: 10px 0;
      color: var(--muted);
      line-height: 1.75;
    }
    ul {
      margin: 14px 0;
      padding-left: 22px;
      color: var(--text);
      line-height: 1.75;
    }
    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { text-decoration: underline; }
    .panel {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px dashed var(--border);
      background: #fbfcfe;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="badge">历史参考稿</div>
    <h1>SVG 预览稿已降级，不再作为规范源</h1>
    <p>
      本文件仅保留为历史参考与设计追溯，不再维护图标定义、预览逻辑或运行时可用性。
      为避免双轨维护，任何新图标或插画调整都必须回填到正式单源。
    </p>

    <div class="panel">
      <ul>
        <li>规范入口：docs/附录 S：SVG图标系统规范.md</li>
        <li>运行时入口：packages/client/src/assets/icons.svg</li>
        <li>渲染组件：packages/client/src/components/SvgIcon.vue</li>
      </ul>
    </div>

    <p>
      如需查看当前生效图标与插画，请以上述正式入口为准；
      本页不再承载“可执行规范”或“最新设计方案”。
    </p>
  </main>
</body>
</html>
