<title>TRPG Icon System Preview</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fff;--fg:#1a1a1a;--card:#f7f8fa;--border:#e5e7eb;--brand:#5B8DB8;--section-bg:#f0f2f5}
[data-theme="dark"]{--bg:#1a1a2e;--fg:#e8e8e8;--card:#252540;--border:#3a3a5c;--brand:#6B9DC8;--section-bg:#20203a}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);padding:32px 24px;max-width:1200px;margin:0 auto;transition:background .3s,color .3s}
h1{font-size:28px;font-weight:700;margin-bottom:4px}
.subtitle{font-size:14px;color:var(--brand);margin-bottom:32px}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:32px;flex-wrap:wrap}
.toolbar button{padding:6px 16px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer;font-size:13px;transition:all .2s}
.toolbar button:hover,.toolbar button.active{border-color:var(--brand);color:var(--brand)}
.size-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.section{margin-bottom:36px}
.section-title{font-size:16px;font-weight:600;margin-bottom:16px;padding:8px 14px;background:var(--section-bg);border-radius:8px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.icon-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:10px;background:var(--card);border:1px solid var(--border);transition:all .2s;cursor:pointer;position:relative}
.icon-card:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 4px 12px rgba(91,141,184,.15)}
.icon-card svg{transition:width .2s,height .2s}
.icon-card .name{font-size:10px;color:var(--fg);opacity:.7;text-align:center;word-break:break-all;line-height:1.3}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.legend{font-size:12px;color:var(--fg);opacity:.6;display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.color-swatch{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--border)}
</style>
</head>

<h1>TRPG Icon System</h1>
<p class="subtitle">Dual-color SVG icon set &mdash; currentColor + Brand Blue</p>

<div class="legend">
  <span><span class="color-swatch" style="background:var(--fg)"></span> currentColor (outline)</span>
  <span><span class="color-swatch" style="background:var(--brand)"></span> Brand Blue (accent)</span>
</div>

<div class="toolbar">
  <button class="theme-btn" onclick="toggleTheme()">Dark Mode</button>
  <button class="size-btn active" data-size="24" onclick="setSize(24,this)">24px</button>
  <button class="size-btn" data-size="32" onclick="setSize(32,this)">32px</button>
  <button class="size-btn" data-size="48" onclick="setSize(48,this)">48px</button>
  <button class="size-btn" data-size="16" onclick="setSize(16,this)">16px</button>
</div>

<div id="sections"></div>
<div class="toast" id="toast"></div>

<script>
const icons = {
  "Navigation (1.5px)": [
    ["icon-home","Home"],["icon-workshop","Workshop"],["icon-editor","Editor"],
    ["icon-room","Room"],["icon-market","Market"],["icon-recruit","Recruit"],["icon-user","User"]
  ],
  "Operations (2px)": [
    ["icon-search","Search"],["icon-plus","Plus"],["icon-close","Close"],
    ["icon-check","Check"],["icon-edit","Edit"],["icon-delete","Delete"],
    ["icon-arrow-left","Arrow Left"],["icon-more","More"],["icon-send","Send"],
    ["icon-download","Download"],["icon-upload","Upload"],["icon-copy","Copy"],
    ["icon-eye","Eye"],["icon-eye-off","Eye Off"],["icon-settings","Settings"]
  ],
  "Status (1.5px)": [
    ["state-empty","Empty"],["state-error","Error"],["state-offline","Offline"],
    ["state-404","404"],["state-forbidden","Forbidden"],["state-loading","Loading"]
  ],
  "TRPG Specials": [
    ["icon-dice","Dice"],["icon-npc","NPC"],["icon-clue","Clue"],
    ["icon-scene","Scene"],["icon-timeline","Timeline"],["icon-broadcast","Broadcast"],
    ["icon-palette","Palette"],["icon-scroll","Scroll"],["icon-grid","Grid"],
    ["icon-clock","Clock"],["icon-history","History"],["icon-lock","Lock"],["icon-unlock","Unlock"]
  ]
};

let currentSize = 24;
const container = document.getElementById('sections');

function render() {
  container.innerHTML = '';
  for (const [title, list] of Object.entries(icons)) {
    let html = `<div class="section"><div class="section-title">${title}</div><div class="grid">`;
    for (const [id, label] of list) {
      html += `<div class="icon-card" onclick="copyIcon('${id}')" title="Click to copy SVG use code">
        <svg width="${currentSize}" height="${currentSize}"><use href="#${id}"/></svg>
        <span class="name">${id}</span>
      </div>`;
    }
    html += '</div></div>';
    container.innerHTML += html;
  }
}

function setSize(s, btn) {
  currentSize = s;
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function toggleTheme() {
  const d = document.documentElement;
  const dark = d.getAttribute('data-theme') === 'dark';
  d.setAttribute('data-theme', dark ? '' : 'dark');
  document.querySelector('.theme-btn').textContent = dark ? 'Dark Mode' : 'Light Mode';
}

function copyIcon(id) {
  const code = `<svg width="24" height="24"><use href="#${id}"/></svg>`;
  navigator.clipboard.writeText(code).then(() => {
    const t = document.getElementById('toast');
    t.textContent = `Copied: ${id}`;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1500);
  });
}

render();
</script>
</body>
</html>
