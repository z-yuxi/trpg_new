<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>新增图标预览</title>
<style>
  body {
    font-family: -apple-system, "Helvetica Neue", sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px;
    gap: 48px;
  }
  h1 { font-size: 20px; font-weight: 500; opacity: 0.8; }
  .grid {
    display: flex;
    gap: 64px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .card svg {
    width: 48px;
    height: 48px;
    color: #e0e0e0;
  }
  .card .label {
    font-size: 13px;
    opacity: 0.6;
  }
  .card .id {
    font-size: 11px;
    font-family: monospace;
    opacity: 0.4;
  }
  .sizes {
    display: flex;
    gap: 24px;
    align-items: flex-end;
  }
  .sizes svg { color: #e0e0e0; }
</style>
</head>
<body>

<!-- 内联 symbol 定义 -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- 叙途：盾牌徽章 + 简略路径 + 顶部星 -->
  <symbol id="icon-journey-b" viewBox="0 0 24 24">
    <!-- 盾牌外形 -->
    <path d="M12 2L4 5v6c0 5.25 3.4 10.2 8 12 4.6-1.8 8-6.75 8-12V5L12 2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 顶部小星（白色/currentColor） -->
    <path d="M12 5.5l.7 1.4 1.5.2-1.1 1 .3 1.5-1.4-.7-1.4.7.3-1.5-1.1-1 1.5-.2z" fill="currentColor" stroke="none"/>
    <!-- 简略路径：一条竖线 + 两个节点 -->
    <line x1="12" y1="11" x2="12" y2="18" stroke="#5B8DB8" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="12" cy="11" r="1.5" fill="none" stroke="#5B8DB8" stroke-width="1.5"/>
    <circle cx="12" cy="18" r="1.5" fill="#5B8DB8" stroke="none"/>
  </symbol>
  <symbol id="icon-studio" viewBox="0 0 24 24">
    <!-- 画板 -->
    <rect x="3" y="3" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="3" y1="7" x2="19" y2="7" stroke="currentColor" stroke-width="1.5"/>
    <!-- 斜笔：笔帽段（上） -->
    <line x1="18" y1="8" x2="16" y2="11.5" stroke="#5B8DB8" stroke-width="2" stroke-linecap="round"/>
    <!-- 留白间隔 -->
    <!-- 笔杆段（下） -->
    <line x1="15" y1="13.5" x2="11.5" y2="19.5" stroke="#5B8DB8" stroke-width="2" stroke-linecap="round"/>
    <!-- 笔尖 -->
    <path d="M11.5 19.5L10 21.5" stroke="#5B8DB8" stroke-width="1" stroke-linecap="round"/>
    <circle cx="10" cy="21.5" r="0.6" fill="#5B8DB8"/>
  </symbol>
  <symbol id="icon-envelope" viewBox="0 0 24 24">
    <rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M3 7l9 6 9-6" fill="none" stroke="#5B8DB8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>

<h1>新增图标预览</h1>

<div class="grid">
  <div class="card">
    <svg><use href="#icon-journey-b"/></svg>
    <span class="label">叙途（盾牌 + 星 + 路径）</span>
    <span class="id">#icon-journey</span>
  </div>
  <div class="card">
    <svg><use href="#icon-studio"/></svg>
    <span class="label">创作台</span>
    <span class="id">#icon-studio</span>
  </div>
  <div class="card">
    <svg><use href="#icon-envelope"/></svg>
    <span class="label">私信</span>
    <span class="id">#icon-envelope</span>
  </div>
</div>

<h1 style="margin-top:24px">多尺寸对比</h1>
<div class="grid">
  <div class="card">
    <div class="sizes">
      <svg style="width:20px;height:20px"><use href="#icon-journey-b"/></svg>
      <svg style="width:32px;height:32px"><use href="#icon-journey-b"/></svg>
      <svg style="width:48px;height:48px"><use href="#icon-journey-b"/></svg>
    </div>
    <span class="id">叙途 20/32/48px</span>
  </div>
  <div class="card">
    <div class="sizes">
      <svg style="width:20px;height:20px"><use href="#icon-studio"/></svg>
      <svg style="width:32px;height:32px"><use href="#icon-studio"/></svg>
      <svg style="width:48px;height:48px"><use href="#icon-studio"/></svg>
    </div>
    <span class="id">20 / 32 / 48px</span>
  </div>
  <div class="card">
    <div class="sizes">
      <svg style="width:20px;height:20px"><use href="#icon-envelope"/></svg>
      <svg style="width:32px;height:32px"><use href="#icon-envelope"/></svg>
      <svg style="width:48px;height:48px"><use href="#icon-envelope"/></svg>
    </div>
    <span class="id">20 / 32 / 48px</span>
  </div>
</div>

</body>
</html>
