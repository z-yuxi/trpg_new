server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── 灰度发布（Canary Release）────────────────────────────────────────
    # 使用方式：
    #   1. 启动灰度实例 server-canary:3001（docker-compose canary profile）
    #   2. 前端/客户端在请求头中带 X-Canary: 1，请求将路由到灰度实例
    #   3. 观察无误后将灰度比例设为 100%，再下掉旧版本
    #
    # 当前策略：基于请求头（内测用户 / QA 专用）
    # 如需基于 Cookie 或随机 1% 流量，参考下方注释示例
    #
    # 基于 Cookie 示例：
    #   map $cookie_canary $upstream_server {
    #     "1"     server-canary:3001;
    #     default server:3000;
    #   }
    map $http_x_canary $upstream_server {
        "1"     server-canary:3001;
        default server:3000;
    }

    # 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资源缓存（Vite 构建产物带 hash）
    location ~* /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service Worker（不缓存）
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # WebManifest
    location = /manifest.json {
        expires 1d;
        add_header Content-Type "application/manifest+json";
        try_files $uri =404;
    }

    # API 反向代理（支持灰度路由）
    location /api/ {
        proxy_pass http://$upstream_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.IO WebSocket 代理（灰度环境保持同一实例，避免断连）
    location /socket.io/ {
        proxy_pass http://$upstream_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;  # WebSocket 长连接
    }

    # SPA fallback（所有未匹配路由返回 index.html）
    location / {
        try_files $uri $uri/ /index.html;
    }
}

